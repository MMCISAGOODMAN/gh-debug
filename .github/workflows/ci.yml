name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Node.js full test suite
  test:
    runs-on: node-20
    env:
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # Lint-only job — test with: gh-debug run ... --job lint
  lint:
    runs-on: node-20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

  # Python job — test with: gh-debug run ... --job python-test
  python-test:
    runs-on: python-3.12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python checks
        run: |
          python3 -c "import sys; print(f'Python {sys.version}')"
          python3 -c "print('All Python checks passed')"

  # Rust build job — test with: gh-debug run ... --job build
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
          key: cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gh-debug-bin
          path: target/debug/gh-debug

  # Deploy simulation — test with: gh-debug run ... --job deploy
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: local-dev
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: gh-debug-bin
          path: ./dist

      - name: Deploy
        run: |
          echo "Deploying to staging..."
          echo "AWS_REGION=$AWS_REGION"
          ls -la ./dist 2>/dev/null || echo "No dist yet (run build job first)"
          echo "Deploy complete"

      - name: Post-deploy script
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Deployment verified via github-script');
            console.log('Repository:', process.env.GITHUB_REPOSITORY);
