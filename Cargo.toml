[package]
name = "gh-debug"
version = "0.1.0"
edition = "2021"
description = "Local GitHub Actions debugger with step-through, breakpoints, and replay"
license = "MIT"

[[bin]]
name = "gh-debug"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bollard = "0.18"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
futures-util = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
